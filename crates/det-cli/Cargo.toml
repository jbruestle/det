[package]
name = "det-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "det command line: generate, calibrate, bench, ppl, info"

[[bin]]
name = "det"
path = "src/main.rs"

[dependencies]
det = { path = "../det" }

[target.'cfg(target_os = "linux")'.dependencies]
det = { path = "../det", features = ["cuda"] }
